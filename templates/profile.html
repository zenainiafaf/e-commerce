                <div class="modal-body" id="messageModalBody">
                    <!-- Content will be set by JavaScript -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            // Check for messages in URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('message')) {
                const message = urlParams.get('message');
                const messageType = urlParams.get('type') || 'info';
                
                $('#messageModalTitle').text(messageType === 'error' ? 'Error' : 'Success');
                $('#messageModalBody').text(decodeURIComponent(message));
                $('#messageModalBody').removeClass().addClass(messageType === 'error' ? 'text-danger' : 'text-success');
                
                const messageModal = new bootstrap.Modal(document.getElementById('messageModal'));
                messageModal.show();
                
                // Clean URL
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            
            // Form validation for password change
            $('#updatePasswordForm').submit(function(e) {
                const newPassword = $('input[name="new_password"]').val();
                const confirmPassword = $('input[name="confirm_password"]').val();
                
                if (newPassword !== confirmPassword) {
                    e.preventDefault();
                    alert('Passwords do not match.');
                }
            });
        });
    </script>
</body>
</html>
